[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "injester"
version = "0.1.0"
description = "Beelzebuth (Injester Community) — Local document ingestion, digital markdown synthesis, and process graph engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "unstructured[pdf,docx]>=0.15",
    "instructor>=1.3",
    "rich>=13.0",
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "markdown>=3.6",
    "python-multipart>=0.0.9",
]

[project.scripts]
injester = "injester.cli:app"
beelzebuth = "injester.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["injester"]
